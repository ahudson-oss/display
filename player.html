<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Display Player</title>
  <style>
    /* Des Moines Prep theme colors for the split-screen column */
    :root {
      --col-bg: #1e293b;     /* dark navy: announcements area */
      --clock-bg: #324b6c;   /* slate blue: clock band */
      --col-text: #f8fafc;   /* off-white: main text */
      --col-muted: #7ba4db;  /* light blue: date, page count */
      --accent: #ffae00;     /* gold: title bar and announcement markers */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }

    /* Full-screen layout (default): slides fill the whole TV */
    #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    /* Split layout (?layout=split): slides on the left 1360 of 1920 px,
       announcements column on the right 560 px. Percentages so it scales to any TV resolution. */
    body.split #stage { width: 70.8333%; }

    .layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .layer.show { opacity: 1; }

    #sidebar { display: none; }
    body.split #sidebar {
      display: flex; flex-direction: column;
      position: absolute; top: 0; right: 0;
      width: 29.1667%; height: 100%;
      overflow: hidden;
      background: var(--col-bg); color: var(--col-text);
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
    }
    /* Each band runs edge to edge; padding lives inside the bands */
    #clock { background: var(--clock-bg); padding: 3.5vh 2.2vw 3vh; }
    #time { font-size: 7vh; font-weight: 700; line-height: 1; }
    #date { font-size: 3vh; color: var(--col-muted); margin-top: 1vh; }
    /* Gold title bar. Sized by width (vw) and never wraps, so "ANNOUNCEMENTS" always fits */
    #annHeader {
      background: var(--accent); color: var(--col-bg);
      padding: 1.6vh 2.2vw;
      font-size: 1.4vw; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: clip;
    }
    #annList {
      flex: 1; list-style: none;
      display: flex; flex-direction: column; gap: 3vh;
      padding: 3.5vh 2.2vw 0;
      transition: opacity 0.6s ease-in-out;
    }
    #annList li {
      font-size: 4.4vh; line-height: 1.2; font-weight: 600;
      border-left: 0.6vh solid var(--accent); padding-left: 1.2vw;
    }
    #annList li.empty { border: none; padding: 0; font-size: 3.4vh; font-weight: 400; color: var(--col-muted); }
    #pager { font-size: 2.2vh; color: var(--col-muted); text-align: right; min-height: 2.2vh; padding: 0 2.2vw 3vh; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <aside id="sidebar">
    <div id="clock">
      <div id="time"></div>
      <div id="date"></div>
    </div>
    <div id="annHeader">Announcements</div>
    <ul id="annList"></ul>
    <div id="pager"></div>
  </aside>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjkJ_PuIuFadQglmJO80_bKePxyPTJMyI",
      authDomain: "prep-signage-c24e9.firebaseapp.com",
      projectId: "prep-signage-c24e9",
      storageBucket: "prep-signage-c24e9.firebasestorage.app",
      messagingSenderId: "160932589745",
      appId: "1:160932589745:web:1f62381bb0f4b5b2aab290",
      measurementId: "G-B0DXNPN0KV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ?screen=Name  ?channel=Name (default hallway)  ?layout=split (default full screen)
    const urlParams = new URLSearchParams(window.location.search);
    const screenId = urlParams.get('screen') || 'TV-Default';
    const layout = urlParams.get('layout') === 'split' ? 'split' : 'full';
    // Split TVs default to the Split Screens slides, so ?layout=split is all they need
    const channel = urlParams.get('channel') || (layout === 'split' ? 'split' : 'hallway');

    const FADE_MS = 800;
    const LOAD_TIMEOUT_MS = 20000;
    const ANN_PER_PAGE = 4;       // announcements shown at once
    const ANN_PAGE_SECONDS = 12;  // how long each page stays up

    const stage = document.getElementById('stage');
    let playlist = [];
    let currentIndex = 0;
    let current = null;
    let timer = null;
    let running = false;
    let nowShowing = 'None';

    // ---------- Heartbeat ----------
    async function sendHeartbeat() {
      try {
        await setDoc(doc(db, "screens", screenId), {
          lastSeen: serverTimestamp(),
          currentSlide: nowShowing,
          channel,
          layout,
          status: 'online'
        }, { merge: true });
      } catch (err) {
        console.warn("Heartbeat failed (offline or network blip):", err);
      }
    }
    sendHeartbeat();
    setInterval(sendHeartbeat, 60000);

    // ---------- Realtime playlist ----------
    const q = query(collection(db, "slides"), where("active", "==", true));
    onSnapshot(q, (snapshot) => {
      const slides = [];
      snapshot.forEach(d => slides.push({ id: d.id, ...d.data() }));

      const channelSlides = slides.filter(item => (item.channel || 'hallway') === channel);
      channelSlides.sort((a, b) => (a.order || 0) - (b.order || 0));

      channelSlides.forEach(item => {
        if (item.type !== 'video') { const pre = new Image(); pre.src = item.imageUrl; }
      });

      playlist = channelSlides;
      if (currentIndex >= playlist.length) currentIndex = 0;
      if (!running && playlist.length > 0) { running = true; showNext(); }
    }, (err) => {
      console.warn("Snapshot error (network jitter); running on memory buffer:", err);
    });

    // ---------- Building and loading a layer ----------
    function makeLayer(item) {
      const isVideo = item.type === 'video';
      const el = document.createElement(isVideo ? 'video' : 'img');
      el.className = 'layer';
      el.dataset.key = item.id + '|' + item.imageUrl;
      if (isVideo) {
        el.muted = true; el.setAttribute('muted', '');
        el.playsInline = true; el.setAttribute('playsinline', '');
        el.preload = 'auto';
      }
      el.src = item.imageUrl;
      return el;
    }

    function whenReady(el) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('load timeout')), LOAD_TIMEOUT_MS);
        const ok = () => { clearTimeout(t); resolve(); };
        const bad = () => { clearTimeout(t); reject(new Error('load error')); };
        if (el.tagName === 'VIDEO') {
          el.addEventListener('canplay', ok, { once: true });
          el.addEventListener('error', bad, { once: true });
        } else {
          if (el.complete && el.naturalWidth) return ok();
          el.addEventListener('load', ok, { once: true });
          el.addEventListener('error', bad, { once: true });
        }
      });
    }

    function removeLayer(el) {
      if (el.tagName === 'VIDEO') { el.pause(); el.removeAttribute('src'); el.load(); }
      el.remove();
    }

    function scheduleAdvance(el, item) {
      clearTimeout(timer);
      if (el.tagName === 'VIDEO') {
        let done = false;
        const advance = () => { if (done) return; done = true; clearTimeout(timer); showNext(); };
        el.addEventListener('ended', advance, { once: true });
        el.addEventListener('error', advance, { once: true });
        const len = isFinite(el.duration) && el.duration > 0 ? el.duration : 120;
        timer = setTimeout(advance, (len + 5) * 1000);
      } else {
        timer = setTimeout(showNext, (item.duration || 10) * 1000);
      }
    }

    // ---------- Main slide loop ----------
    async function showNext() {
      clearTimeout(timer);

      if (playlist.length === 0) {
        if (current) { const old = current; old.classList.remove('show'); setTimeout(() => removeLayer(old), FADE_MS + 100); }
        current = null; nowShowing = 'None'; running = false;
        return;
      }

      if (currentIndex >= playlist.length) currentIndex = 0;
      const item = playlist[currentIndex];
      currentIndex = (currentIndex + 1) % playlist.length;
      const key = item.id + '|' + item.imageUrl;

      if (current && current.dataset.key === key) {
        if (current.tagName === 'VIDEO') { current.currentTime = 0; current.play().catch(() => {}); }
        scheduleAdvance(current, item);
        return;
      }

      const next = makeLayer(item);
      stage.appendChild(next);

      try {
        await whenReady(next);
        if (next.tagName === 'VIDEO') await next.play().catch(e => console.warn('Autoplay blocked:', e));
      } catch (e) {
        console.warn('Skipping slide that failed to load:', item.title, e);
        removeLayer(next);
        timer = setTimeout(showNext, 1000);
        return;
      }

      next.classList.add('show');
      const old = current;
      current = next;
      nowShowing = item.title || 'Untitled';
      if (old) setTimeout(() => removeLayer(old), FADE_MS + 100);

      scheduleAdvance(next, item);
    }

    // ---------- Split layout: clock + announcements ----------
    // Only runs on TVs with ?layout=split. Full-screen TVs never load announcements.
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function startSidebar() {
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');
      const listEl = document.getElementById('annList');
      const pagerEl = document.getElementById('pager');

      function tickClock() {
        const now = new Date();
        timeEl.textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      }
      tickClock();
      setInterval(tickClock, 10000);

      let announcements = [];
      let page = 0;

      // Live = has text and its end date is today or later. Shown oldest-first, same order as admin.
      function liveAnnouncements() {
        const today = todayStr();
        return announcements
          .filter(a => a.text && (!a.endDate || a.endDate >= today))
          .sort((a, b) => (a.createdAt?.toMillis?.() ?? Infinity) - (b.createdAt?.toMillis?.() ?? Infinity));
      }

      function drawPage(items, pages) {
        listEl.innerHTML = '';
        if (items.length === 0) {
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = 'No announcements right now.';
          listEl.appendChild(li);
        } else {
          items.forEach(a => {
            const li = document.createElement('li');
            li.textContent = a.text; // textContent, never innerHTML, so typed text can't break the page
            listEl.appendChild(li);
          });
        }
        pagerEl.textContent = pages > 1 ? `${page + 1} / ${pages}` : '';
      }

      function render(advance) {
        const live = liveAnnouncements();
        const pages = Math.max(1, Math.ceil(live.length / ANN_PER_PAGE));
        if (advance) page = (page + 1) % pages;
        if (page >= pages) page = 0;
        const items = live.slice(page * ANN_PER_PAGE, (page + 1) * ANN_PER_PAGE);

        if (!advance) { drawPage(items, pages); return; }
        if (pages === 1 && listEl.children.length === items.length && items.length > 0) {
          drawPage(items, pages); return; // one page only: refresh quietly, no flicker
        }
        listEl.style.opacity = '0';
        setTimeout(() => { drawPage(items, pages); listEl.style.opacity = '1'; }, 600);
      }

      onSnapshot(collection(db, "announcements"), (snap) => {
        const list = [];
        snap.forEach(d => list.push({ id: d.id, ...d.data() }));
        announcements = list;
        render(false);
      }, (err) => {
        // If announcements can't load (rules, network), the slides keep running regardless
        console.warn("Announcements unavailable:", err);
      });

      render(false);
      setInterval(() => render(true), ANN_PAGE_SECONDS * 1000);
    }

    if (layout === 'split') {
      document.body.classList.add('split');
      startSidebar();
    }

    // Daily 3:00 AM clean refresh to clear browser RAM
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 3 && now.getMinutes() === 0) window.location.reload();
    }, 60000);
  </script>
</body>
</html>
