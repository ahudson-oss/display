<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Display Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    #slide {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 1;
      transition: opacity 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <img id="slide" alt="" />

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot } 
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
   
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Read ?screen=Name from the TV's configured URL Launcher address
const urlParams = new URLSearchParams(window.location.search);
const screenId = urlParams.get('screen') || 'TV-Default';

async function sendHeartbeat() {
  try {
    await setDoc(doc(db, "screens", screenId), {
      lastSeen: serverTimestamp(),
      currentSlide: playlist[currentIndex]?.title || 'None',
      status: 'online'
    }, { merge: true });
  } catch (err) {
    console.warn("Heartbeat failed (offline or network blip):", err);
  }
}

// Send initial ping, then ping every 60 seconds
sendHeartbeat();
setInterval(sendHeartbeat, 60000);

  // PASTE YOUR CONFIG HERE
    const firebaseConfig = {
      apiKey: "AIzaSyAjkJ_PuIuFadQglmJO80_bKePxyPTJMyI",
      authDomain: "prep-signage-c24e9.firebaseapp.com",
      projectId: "prep-signage-c24e9",
      storageBucket: "prep-signage-c24e9.firebasestorage.app",
      messagingSenderId: "160932589745",
      appId: "1:160932589745:web:1f62381bb0f4b5b2aab290",
      measurementId: "G-B0DXNPN0KV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let playlist = [];
    let currentIndex = 0;
    let timer = null;
    const imgEl = document.getElementById('slide');

    // Realtime Listener: updates instantly whenever a slide is added, edited, or deleted
    const q = query(collection(db, "slides"), where("active", "==", true));
    onSnapshot(q, (snapshot) => {
      const slides = [];
      snapshot.forEach(doc => slides.push({ id: doc.id, ...doc.data() }));
      
      // Sort in memory by order or title
      slides.sort((a, b) => (a.order || 0) - (b.order || 0));

      // Preload images into memory so slow networks never flash a white screen
      slides.forEach(item => {
        const pre = new Image();
        pre.src = item.imageUrl;
      });

      playlist = slides;
      if (currentIndex >= playlist.length) currentIndex = 0;
      if (!timer && playlist.length > 0) rotate();
    }, (err) => {
      console.warn("Snapshot error (network jitter); running on memory buffer:", err);
    });

    function rotate() {
      if (playlist.length === 0) {
        timer = null;
        imgEl.style.opacity = '0';
        return;
      }

      const item = playlist[currentIndex];
      imgEl.style.opacity = '0';
      setTimeout(() => {
        imgEl.src = item.imageUrl;
        imgEl.style.opacity = '1';
      }, 500);

      currentIndex = (currentIndex + 1) % playlist.length;
      timer = setTimeout(rotate, (item.duration || 10) * 1000);
    }

    // Daily 3:00 AM clean refresh to clear browser RAM
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 3 && now.getMinutes() === 0) window.location.reload();
    }, 60000);
  </script>
</body>
</html>
