<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TV Display Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
    body, html { width: 100vw; height: 100vh; overflow: hidden; background: #000; }
    #stage { position: relative; width: 100%; height: 100%; }
    /* Every slide (image or video) is a layer stacked on top of the last one.
       The new layer fades IN over the old one, which stays fully visible underneath,
       so the screen never passes through black. */
    .layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .layer.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, setDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjkJ_PuIuFadQglmJO80_bKePxyPTJMyI",
      authDomain: "prep-signage-c24e9.firebaseapp.com",
      projectId: "prep-signage-c24e9",
      storageBucket: "prep-signage-c24e9.firebasestorage.app",
      messagingSenderId: "160932589745",
      appId: "1:160932589745:web:1f62381bb0f4b5b2aab290",
      measurementId: "G-B0DXNPN0KV"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ?screen=Name and ?channel=Name from the TV's URL. channel defaults to "hallway".
    const urlParams = new URLSearchParams(window.location.search);
    const screenId = urlParams.get('screen') || 'TV-Default';
    const channel = urlParams.get('channel') || 'hallway';

    const FADE_MS = 800;          // keep in sync with the CSS transition
    const LOAD_TIMEOUT_MS = 20000; // skip a slide that won't load instead of freezing

    const stage = document.getElementById('stage');
    let playlist = [];
    let currentIndex = 0;
    let current = null;      // the layer currently on screen
    let timer = null;
    let running = false;
    let nowShowing = 'None';

    // ---------- Heartbeat (moved below db so the first ping doesn't fail) ----------
    async function sendHeartbeat() {
      try {
        await setDoc(doc(db, "screens", screenId), {
          lastSeen: serverTimestamp(),
          currentSlide: nowShowing,
          channel,
          status: 'online'
        }, { merge: true });
      } catch (err) {
        console.warn("Heartbeat failed (offline or network blip):", err);
      }
    }
    sendHeartbeat();
    setInterval(sendHeartbeat, 60000);

    // ---------- Realtime playlist ----------
    const q = query(collection(db, "slides"), where("active", "==", true));
    onSnapshot(q, (snapshot) => {
      const slides = [];
      snapshot.forEach(d => slides.push({ id: d.id, ...d.data() }));

      const channelSlides = slides.filter(item => (item.channel || 'hallway') === channel);
      channelSlides.sort((a, b) => (a.order || 0) - (b.order || 0));

      // Warm the cache for images (videos load when their turn comes)
      channelSlides.forEach(item => {
        if (item.type !== 'video') { const pre = new Image(); pre.src = item.imageUrl; }
      });

      playlist = channelSlides;
      if (currentIndex >= playlist.length) currentIndex = 0;
      if (!running && playlist.length > 0) { running = true; showNext(); }
    }, (err) => {
      console.warn("Snapshot error (network jitter); running on memory buffer:", err);
    });

    // ---------- Building and loading a layer ----------
    // Note: the Firestore field is still called imageUrl for videos too, so old slides need no migration.
    function makeLayer(item) {
      const isVideo = item.type === 'video';
      const el = document.createElement(isVideo ? 'video' : 'img');
      el.className = 'layer';
      el.dataset.key = item.id + '|' + item.imageUrl;
      if (isVideo) {
        // TV browsers only autoplay muted video
        el.muted = true; el.setAttribute('muted', '');
        el.playsInline = true; el.setAttribute('playsinline', '');
        el.preload = 'auto';
      }
      el.src = item.imageUrl;
      return el;
    }

    function whenReady(el) {
      return new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('load timeout')), LOAD_TIMEOUT_MS);
        const ok = () => { clearTimeout(t); resolve(); };
        const bad = () => { clearTimeout(t); reject(new Error('load error')); };
        if (el.tagName === 'VIDEO') {
          el.addEventListener('canplay', ok, { once: true });
          el.addEventListener('error', bad, { once: true });
        } else {
          if (el.complete && el.naturalWidth) return ok();
          el.addEventListener('load', ok, { once: true });
          el.addEventListener('error', bad, { once: true });
        }
      });
    }

    function removeLayer(el) {
      if (el.tagName === 'VIDEO') { el.pause(); el.removeAttribute('src'); el.load(); } // frees TV memory
      el.remove();
    }

    // ---------- When to move on ----------
    function scheduleAdvance(el, item) {
      clearTimeout(timer);
      if (el.tagName === 'VIDEO') {
        let done = false;
        const advance = () => { if (done) return; done = true; clearTimeout(timer); showNext(); };
        el.addEventListener('ended', advance, { once: true });
        el.addEventListener('error', advance, { once: true });
        // Safety net in case 'ended' never fires (stalled stream): full length + 5s
        const len = isFinite(el.duration) && el.duration > 0 ? el.duration : 120;
        timer = setTimeout(advance, (len + 5) * 1000);
      } else {
        timer = setTimeout(showNext, (item.duration || 10) * 1000);
      }
    }

    // ---------- Main loop ----------
    async function showNext() {
      clearTimeout(timer);

      if (playlist.length === 0) {
        if (current) { const old = current; old.classList.remove('show'); setTimeout(() => removeLayer(old), FADE_MS + 100); }
        current = null; nowShowing = 'None'; running = false;
        return;
      }

      if (currentIndex >= playlist.length) currentIndex = 0;
      const item = playlist[currentIndex];
      currentIndex = (currentIndex + 1) % playlist.length;
      const key = item.id + '|' + item.imageUrl;

      // Only one slide in the rotation: reuse what's on screen (replay if it's a video)
      if (current && current.dataset.key === key) {
        if (current.tagName === 'VIDEO') { current.currentTime = 0; current.play().catch(() => {}); }
        scheduleAdvance(current, item);
        return;
      }

      const next = makeLayer(item);
      stage.appendChild(next); // sits on top, invisible until ready

      try {
        await whenReady(next);
        if (next.tagName === 'VIDEO') await next.play().catch(e => console.warn('Autoplay blocked:', e));
      } catch (e) {
        console.warn('Skipping slide that failed to load:', item.title, e);
        removeLayer(next);
        timer = setTimeout(showNext, 1000);
        return;
      }

      // Fade the new layer in over the old one, then clean up the old one
      next.classList.add('show');
      const old = current;
      current = next;
      nowShowing = item.title || 'Untitled';
      if (old) setTimeout(() => removeLayer(old), FADE_MS + 100);

      scheduleAdvance(next, item);
    }

    // Daily 3:00 AM clean refresh to clear browser RAM
    setInterval(() => {
      const now = new Date();
      if (now.getHours() === 3 && now.getMinutes() === 0) window.location.reload();
    }, 60000);
  </script>
</body>
</html>
